<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Persistent School Schedule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>School Schedule</h1>
        <p id="currentDay">Loading Day...</p>
        <button id="editButton">✏️ Edit Schedule</button>
    </header>

    <main class="schedule-container">
        </main>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Edit Schedule Data (JSON)</h2>
            <textarea id="scheduleJsonInput"></textarea>
            <button id="saveChangesButton">💾 Save Changes (To GitHub)</button>
            <p id="saveStatus"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
